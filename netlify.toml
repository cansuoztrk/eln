# Netlify artık yalnız taşınma köprüsünü yayınlar (kopru/): eski adres ve QR, kaleyi yeni adrese (Cloudflare Pages) taşır.
[build]
  publish = "kopru"
  command = ""

# Service worker her zaman taze gelsin (yeni sürümler hemen yüklensin)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Paketler içerik özetli adla gelir (tools/bundle.mjs); adı değişmeden içeriği değişmez
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
