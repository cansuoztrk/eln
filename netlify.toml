# Netlify: derleme yok, depo kökü olduğu gibi yayınlanır. Özel içerik zaten şifreli (assets/vault).
[build]
  publish = "."
  command = ""

# Service worker her zaman taze gelsin (yeni sürümler hemen yüklensin)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Paketler içerik özetli adla gelir (tools/bundle.mjs); adı değişmeden içeriği değişmez
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
