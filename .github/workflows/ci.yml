name: CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['games/**', 'apps/lale/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['games/**', 'apps/lale/**', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also compile the iOS apps for the simulator (macOS runner)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: ${{ matrix.game.name }} · typecheck, tests, web build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          - { dir: lokum-blast, path: games/lokum-blast, name: Lokum Blast }
          - { dir: simit-tycoon, path: games/simit-tycoon, name: Simit Tycoon }
          - { dir: bookcat, path: games/bookcat, name: Kitap Kedisi }
          - { dir: lale, path: apps/lale, name: Lale }
    defaults:
      run:
        working-directory: ${{ matrix.game.path }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.game.path }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.game.dir }}-web
          path: ${{ matrix.game.path }}/dist
          retention-days: 14

  android:
    name: ${{ matrix.game.name }} · Android debug APK
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          - { dir: lokum-blast, path: games/lokum-blast, name: Lokum Blast }
          - { dir: simit-tycoon, path: games/simit-tycoon, name: Simit Tycoon }
          - { dir: bookcat, path: games/bookcat, name: Kitap Kedisi }
          - { dir: lale, path: apps/lale, name: Lale }
    defaults:
      run:
        working-directory: ${{ matrix.game.path }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.game.path }}/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: ${{ matrix.game.path }}/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.game.dir }}-debug-apk
          path: ${{ matrix.game.path }}/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    name: ${{ matrix.game.name }} · iOS simulator build
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    needs: web
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        game:
          - { dir: lokum-blast, path: games/lokum-blast, name: Lokum Blast }
          - { dir: simit-tycoon, path: games/simit-tycoon, name: Simit Tycoon }
          - { dir: bookcat, path: games/bookcat, name: Kitap Kedisi }
          - { dir: lale, path: apps/lale, name: Lale }
    defaults:
      run:
        working-directory: ${{ matrix.game.path }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.game.path }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for simulator (no signing)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
