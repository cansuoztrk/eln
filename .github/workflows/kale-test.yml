# Test robotu: her gönderimde kalenin sözdizimini, paketin güncelliğini, pul tutarlılığını ve iki sayfanın tarayıcıda
# hatasız açıldığını denetler. Kasa şifresi gerekmez; bozulan bir şey Elnoş'a ulaşmadan yakalanır.
name: Kale testi
on:
  push:
    branches: ['claude/**', 'main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (Chromium)
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test robotu
        run: node tools/ci.mjs
