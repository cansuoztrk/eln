name: Website (manual)

# Publishes site/public to GitHub Pages — MANUAL ONLY.
#
# ⚠️ This repository already serves another site through GitHub Pages. Running
# this workflow (after switching Settings › Pages › Source to "GitHub Actions")
# would REPLACE that site. Recommended instead: deploy site/public to
# Cloudflare Pages or Netlify, or move site/ to its own repository
# (e.g. tekirstudios/website) and run this workflow there.
#
# To run it anyway: Actions › Website (manual) › Run workflow, and type
# `replace-pages-site` in the confirmation box.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type replace-pages-site to publish (this replaces the current GitHub Pages site of this repository)'
        required: true
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirm == 'replace-pages-site'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
